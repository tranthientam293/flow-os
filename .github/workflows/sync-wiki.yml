name: Sync wiki

# Publishes the Markdown files matching WIKI_PAGES to the repository's GitHub
# wiki. Every file lands at the wiki's root under its own name (the wiki has
# no folders), so names must be unique. Pages this workflow published earlier
# and since removed from the repo are deleted; pages made in the wiki by hand
# are left alone. The wiki must have at least one page (create it in the
# GitHub UI once) before the first run.

# Runs only by hand: Actions → Sync wiki → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Globs of files that become wiki pages, separated by spaces. Roster's v1
  # planning docs (plan.md, data-model.md, design.md) stay out.
  WIKI_PAGES: >-
    docs/wiki/*.md
    docs/apps/ledger/*.md
    docs/apps/roster/Roster*.md
  # Lists what the last run published, so removed pages can be deleted.
  MANIFEST: .synced-from-repo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Clone the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            wiki

      - name: Copy pages
        run: |
          set -euo pipefail
          shopt -s nullglob
          staging="$(mktemp -d)"

          # Split without expanding, so each glob is checked on its own.
          read -ra patterns <<< "$WIKI_PAGES"
          for pattern in "${patterns[@]}"; do
            files=($pattern)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::$pattern matches no files"
              exit 1
            fi
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if [ -e "$staging/$name" ]; then
                echo "::error file=$file::$name is used twice; wiki page names must be unique"
                exit 1
              fi
              cp "$file" "$staging/$name"
            done
          done

          # Delete pages published last time that are gone from the repo.
          if [ -f "wiki/$MANIFEST" ]; then
            while IFS= read -r name; do
              if [ -n "$name" ] && [ ! -e "$staging/$name" ]; then
                rm -f "wiki/$name"
              fi
            done < "wiki/$MANIFEST"
          fi

          (cd "$staging" && ls -1) > "wiki/$MANIFEST"
          cp "$staging"/*.md wiki/

      - name: Push
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
